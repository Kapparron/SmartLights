name: Comprobaciones

# Compila la app en cada cambio, para que nada llegue roto a main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew :core:compileKotlin :app:assembleDebug --no-daemon
        working-directory: android
